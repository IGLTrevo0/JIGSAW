<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Phoenix Jigsaw Puzzle — drag and drop 100 pieces to assemble a phoenix image.">
    <title>Phoenix Jigsaw Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <aside id="tray">
        <div id="tray-label">Pieces</div>
        <div id="tray-pieces"></div>
    </aside>

    <main id="board-area">
        <div style="color: white; font-size: 12px; opacity: 0.6; text-align: center; margin-bottom: 8px;">Hold the box for 2 seconds before sliding</div>
        <div id="board"></div>
    </main>

    <div id="win-msg" class="hidden">
        <div id="win-content">
            <div id="win-text">You Win 🔥</div>
            <button id="play-again">Play Again</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
